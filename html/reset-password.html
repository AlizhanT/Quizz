<!DOCTYPE html>
<html class="light" lang="kk">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title data-translate="page.resetPassword.title">Reset Password - Oimergen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Inter:wght@400;500;600;700&amp;family=Roboto:wght@400;500;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed": "#23005c",
                    "surface": "#f9f9ff",
                    "on-tertiary-container": "#fffbff",
                    "on-error": "#ffffff",
                    "primary": "#4648d4",
                    "surface-tint": "#494bd6",
                    "primary-container": "#6063ee",
                    "on-secondary-fixed": "#002113",
                    "surface-container": "#e7eeff",
                    "inverse-surface": "#263143",
                    "surface-container-lowest": "#ffffff",
                    "secondary-container": "#6cf8bb",
                    "tertiary": "#6b38d4",
                    "primary-fixed": "#e1e0ff",
                    "on-surface-variant": "#464554",
                    "inverse-primary": "#c0c1ff",
                    "secondary-fixed": "#6ffbbe",
                    "tertiary-fixed-dim": "#d0bcff",
                    "tertiary-container": "#8455ef",
                    "on-tertiary": "#ffffff",
                    "surface-container-high": "#dee8ff",
                    "on-background": "#111c2d",
                    "surface-variant": "#d8e3fb",
                    "on-primary-container": "#fffbff",
                    "surface-container-highest": "#d8e3fb",
                    "on-secondary-fixed-variant": "#005236",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "inverse-on-surface": "#ecf1ff",
                    "background": "#f9f9ff",
                    "secondary": "#006c49",
                    "error": "#ba1a1a",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#f0f3ff",
                    "outline-variant": "#c7c4d7",
                    "surface-bright": "#f9f9ff",
                    "error-container": "#ffdad6",
                    "on-primary-fixed": "#07006c",
                    "tertiary-fixed": "#e9ddff",
                    "primary-fixed-dim": "#c0c1ff",
                    "on-primary": "#ffffff",
                    "secondary-fixed-dim": "#4edea3",
                    "on-surface": "#111c2d",
                    "on-secondary-container": "#00714d",
                    "outline": "#767586",
                    "on-tertiary-fixed-variant": "#5516be",
                    "surface-dim": "#cfdaf2",
                    "on-secondary": "#ffffff"
            },
            "borderRadius": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body { font-family: 'Inter', 'Roboto', sans-serif; background-color: #f9f9ff; }
        h1, h2, h3, h4, .font-headline { font-family: 'Montserrat', sans-serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #4648d4;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #3638b4;
        }
        
        /* Firefox Scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: #4648d4 #f1f1f1;
        }

    <!-- Original CSS files -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/welcome.css">
</head>
<body class="text-on-background">
<!-- Top Navigation Bar -->
<header class="bg-[#f9f9ff]/80 backdrop-blur-xl docked full-width top-0 sticky z-50 shadow-[0_32px_64px_-15px_rgba(99,102,241,0.08)]">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
<div class="modal-logo-text">Oimergen</div>
<div class="flex items-center gap-4">
<div class="relative mr-2">
<div class="language-dropdown">
<button class="flex items-center gap-2 px-3 py-2 rounded-xl bg-surface-container-low border border-outline-variant/30 text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-lg">language</span>
<span class="text-xs font-bold">KK</span>
<span class="material-symbols-outlined text-sm">expand_more</span>
</button>
<div class="absolute right-0 top-full mt-0 w-32 bg-white rounded-xl shadow-xl border border-outline-variant/20 py-2 hidden z-50 animate-in fade-in slide-in-from-top-1 duration-200" id="languageDropdownMenu">
<a class="flex items-center gap-3 px-4 py-2 hover:bg-primary/5 text-sm font-medium text-on-surface hover:text-primary transition-colors" href="#" onclick="changeLanguage('kk')">
<span class="w-2 h-2 rounded-full bg-primary"></span>
      Қазақша
    </a>
<a class="flex items-center gap-3 px-4 py-2 hover:bg-primary/5 text-sm font-medium text-on-surface hover:text-primary transition-colors" href="#" onclick="changeLanguage('ru')">
<span class="w-2 h-2 rounded-full bg-transparent"></span>
      Русский
    </a>
<a class="flex items-center gap-3 px-4 py-2 hover:bg-primary/5 text-sm font-medium text-on-surface hover:text-primary transition-colors" href="#" onclick="changeLanguage('en')">
<span class="w-2 h-2 rounded-full bg-transparent"></span>
      English
    </a>
</div>
</div>
</div>
<button class="font-plusJakartaSans font-bold text-sm text-slate-600 hover:scale-105 transition-transform duration-200" onclick="window.location.href='welcome.html'" data-translate="navigation.home">Home</button>
</div>
</div>
</header>

<main class="min-h-screen flex items-center justify-center px-6 py-20">
<div class="w-full max-w-md">
<!-- Reset Password Modal -->
<div class="modal" style="display: flex; opacity: 1; visibility: visible;">
<div class="modal-content" style="transform: scale(1);">
<div class="modal-logo">
<div class="modal-logo-text">Oimergen</div>
</div>
<div class="modal-body">
<!-- Loading State -->
<div id="loadingState" style="display: none; text-align: center; padding: 40px 0;">
<div class="loading-spinner" style="width: 48px; height: 48px; border: 4px solid #e7eeff; border-top: 4px solid #4648d4; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
<p data-translate="modal.auth.resetPassword.loading" style="color: #6B7280; font-size: 15px;">Verifying reset token...</p>
</div>

<!-- Error State -->
<div id="errorState" style="display: none; text-align: center; padding: 20px 0;">
<div class="modal-icon error" style="margin: 0 auto 16px;">✗</div>
<h3 data-translate="modal.auth.resetPassword.errorTitle" style="font-size: 24px; font-weight: 700; color: #111827; margin: 0 0 8px 0; font-family: 'Montserrat', sans-serif;">Reset Link Invalid</h3>
<p data-translate="modal.auth.resetPassword.invalidToken" style="color: #6B7280; margin: 0 0 24px 0; line-height: 1.5; font-size: 15px;">This password reset link is invalid or has expired.</p>
<button type="button" class="btn-primary" onclick="goHomeSafely()" data-translate="modal.auth.resetPassword.backToHome" style="width: 100%; height: 52px; border-radius: 14px; font-size: 16px; font-weight: 600; background: #2196F3; color: white; box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3); border: none; cursor: pointer; transition: all 0.2s ease;">Back to Home</button>
</div>

<!-- Reset Form -->
<div id="resetPasswordFormContainer" style="display: none;">
<h3 data-translate="modal.auth.resetPassword.title" style="font-size: 30px; font-weight: 700; color: #111827; margin: 0 0 8px 0; font-family: 'Montserrat', sans-serif; text-align: center; letter-spacing: -0.5px;">Reset Your Password</h3>
<p data-translate="modal.auth.resetPassword.description" style="color: #6B7280; margin: 0 0 32px 0; line-height: 1.5; font-size: 15px; text-align: center;">Enter your new password below.</p>
<form id="resetPasswordForm" class="auth-form">
<div class="form-group">
<label for="newPassword" data-translate="modal.auth.resetPassword.newPassword" style="display: block; font-weight: 500; color: #374151; margin-bottom: 8px; font-size: 14px; font-family: 'Inter', sans-serif;">New Password</label>
<div class="password-input-wrapper">
<span class="input-icon" style="position: absolute; left: 16px; color: #9CA3AF; pointer-events: none; z-index: 1;">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
<path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
</svg>
</span>
<input type="password" id="newPassword" name="newPassword" required maxlength="50" placeholder="Enter your new password" style="width: 100%; padding: 16px 16px 16px 48px; border: 1px solid #E5E7EB; border-radius: 14px; font-size: 15px; transition: all 0.2s ease; font-family: 'Inter', sans-serif; background: #ffffff; color: #111827; height: 52px; outline: none; box-sizing: border-box;">
<span class="char-counter" id="newPasswordCounter" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #9CA3AF; pointer-events: none; font-weight: 500; z-index: 2;">0/6</span>
</div>
</div>
<div class="form-group">
<label for="confirmNewPassword" data-translate="modal.auth.resetPassword.confirmPassword" style="display: block; font-weight: 500; color: #374151; margin-bottom: 8px; font-size: 14px; font-family: 'Inter', sans-serif;">Confirm New Password</label>
<div class="password-input-wrapper">
<span class="input-icon" style="position: absolute; left: 16px; color: #9CA3AF; pointer-events: none; z-index: 1;">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
<path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
</svg>
</span>
<input type="password" id="confirmNewPassword" name="confirmNewPassword" required placeholder="Confirm your new password" style="width: 100%; padding: 16px 16px 16px 48px; border: 1px solid #E5E7EB; border-radius: 14px; font-size: 15px; transition: all 0.2s ease; font-family: 'Inter', sans-serif; background: #ffffff; color: #111827; height: 52px; outline: none; box-sizing: border-box;">
</div>
<div class="password-indicator" id="resetPasswordIndicator" style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; color: #6B7280;">
<span class="indicator-text" data-translate="modal.auth.resetPassword.passwordMatch">Passwords must match</span>
<span class="indicator-icon" id="resetPasswordMatchIcon" style="font-size: 14px; transition: color 0.2s ease; color: #dc2626;">✗</span>
</div>
</div>
</form>
</div>
<div class="modal-footer">
<button type="submit" form="resetPasswordForm" class="btn-primary" id="resetPasswordSubmitBtn" disabled data-translate="modal.auth.resetPassword.submit" style="width: 100%; height: 52px; border-radius: 14px; font-size: 16px; font-weight: 600; background: #2196F3; color: white; box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3); border: none; cursor: pointer; transition: all 0.2s ease;">Reset Password</button>
</div>

<!-- Success State -->
<div id="successState" style="display: none; text-align: center; padding: 20px 0;">
<div class="modal-icon success" style="margin: 0 auto 16px;">✓</div>
<h3 data-translate="modal.auth.resetPassword.successTitle" style="font-size: 30px; font-weight: 700; color: #111827; margin: 0 0 8px 0; font-family: 'Montserrat', sans-serif; text-align: center; letter-spacing: -0.5px;">Password Reset Successful!</h3>
<p data-translate="modal.auth.resetPassword.success" style="color: #6B7280; margin: 0 0 32px 0; line-height: 1.5; font-size: 15px; text-align: center;">Your password has been reset successfully!</p>
<button type="button" class="btn-primary" onclick="window.location.href='welcome.html'" data-translate="modal.auth.resetPassword.login" style="width: 100%; height: 52px; border-radius: 14px; font-size: 16px; font-weight: 600; background: #2196F3; color: white; box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3); border: none; cursor: pointer; transition: all 0.2s ease;">Log In</button>
</div>
</div>
</div>
</div>
</main>

<style>
@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}

.auth-form input:focus {
border-color: #2196F3 !important;
box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1) !important;
}

.btn-primary:hover {
background: #1976D2;
box-shadow: 0 6px 16px rgba(33, 150, 243, 0.4);
transform: translateY(-1px);
}

.btn-primary:active {
transform: translateY(0);
}

.btn-primary:disabled {
background: #9CA3AF;
box-shadow: none;
cursor: not-allowed;
transform: none;
}

.char-counter.valid {
color: #065f46;
}

.char-counter.invalid {
color: #dc2626;
}

.indicator-icon.valid {
color: #065f46;
}

.indicator-icon.invalid {
color: #dc2626;
}
</style>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/language.js"></script>
    <script src="../js/reset-password.js"></script>
</body>
</html>
